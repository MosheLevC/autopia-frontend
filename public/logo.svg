<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Autopia">
  <defs>
    <linearGradient id="autopiaGaugeBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#autopiaGaugeBadge)"/>

  <!-- gauge track -->
  <path d="M14.8 45.05 A21 21 0 1 1 49.2 45.05"
        fill="none" stroke="#ffffff" stroke-opacity="0.3"
        stroke-width="4.2" stroke-linecap="round"/>

  <!-- gauge sweep -->
  <path d="M14.8 45.05 A21 21 0 0 1 45.5 16.91"
        fill="none" stroke="#a5f3fc"
        stroke-width="4.2" stroke-linecap="round"/>

  <!-- A monogram -->
  <path d="M23.2 43.6 L32 20.8 L40.8 43.6"
        fill="none" stroke="#ffffff"
        stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 36.6 H37"
        fill="none" stroke="#ffffff"
        stroke-width="4.2" stroke-linecap="round"/>
</svg>
